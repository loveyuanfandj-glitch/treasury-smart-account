[profile.default]
solc_version = "0.8.34"
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200

[invariant]
runs = 128
depth = 32
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

[lint]
# Time is an explicit protocol input covered by boundary tests and the threat model.
exclude_lints = ["block-timestamp"]
